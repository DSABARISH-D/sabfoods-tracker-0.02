name: Validate SAB Foods Tracker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: sabfoods-dist
          path: dist/
          if-no-files-found: error
