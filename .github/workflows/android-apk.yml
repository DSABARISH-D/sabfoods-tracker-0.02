name: Build Android APK
on:
  push:
    branches: [feature/manual-upi-review]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Install Android wrapper dependencies
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: https://gwaicgqoxyqjcrtdfuip.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_lX5lvoNPJ2nCxKzQlU9Cog_hnhouan9
        run: |
          npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SAB-Foods-Tracker-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
